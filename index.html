
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhial Portfolio</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  overflow-x:hidden;
}

/* Animated background */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
  background:linear-gradient(-45deg,#0f172a,#1e293b,#111827,#0b1220);
  background-size:400% 400%;
  animation:bg 10s infinite;
}

@keyframes bg{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Navbar */
nav{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:20px;
  background:rgba(0,0,0,0.5);
  padding:10px 20px;
  border-radius:30px;
}

nav a{
  color:white;
  text-decoration:none;
}

/* Hero */
.hero{
  text-align:center;
  padding:140px 20px;
}

.btn{
  background:#38bdf8;
  padding:10px 15px;
  border-radius:8px;
  display:inline-block;
  margin-top:10px;
  color:black;
  text-decoration:none;
}

.cv{background:#22c55e;}

/* Sections */
section{
  padding:50px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:10px;
}

/* Contact */
input,textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
}
</style>
</head>

<body>

<div class="bg"></div>

<nav>
  <a href="#about">About</a>
  <a href="#skills">Skills</a>
  <a href="#contact">Contact</a>
</nav>

<div class="hero">
  <h1>Nhial Gatkuoth Rut</h1>
  <p>Electrical & Computer Engineering Student</p>

  <a class="btn" href="#contact">Contact</a>
  <a class="btn cv" href="cv.pdf" download>Download CV</a>
</div>

<section id="about">
  <div class="card">
    <h2>About</h2>
    <p>Engineering student from Wollega University, passionate about programming and electronics.</p>
  </div>
</section>

<section id="skills">
  <div class="card">
    <h2>Skills</h2>
    <p>Java, C++, HTML, CSS, Signal Processing, Electronics</p>
  </div>
</section>

<section id="contact">
  <div class="card">
    <h2>Contact</h2>

    <form action="mailto:nhialgatkuothrut@gmail.com">
      <input placeholder="Name">
      <input placeholder="Email">
      <textarea placeholder="Message"></textarea>
      <button>Send</button>
    </form>

  </div>
</section>

<script>
// simple JS animation or future upgrade
console.log("Portfolio Loaded");
</script>

</body>
</html>
